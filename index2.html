<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demande de consultation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Demande de consultation</h1>
    <p class="subtitle">Create your patient account to access your personal space.</p>

    <form id="signupForm" novalidate>
      <div class="field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. 07XXXXXXXX" required>
        <small class="error"></small>
      </div>

      <button type="submit" class="btn">Create Account</button>
      <p id="formMessage" class="form-message" role="status"></p>
    </form>

    <p class="footer">Already have an account? <a href="#">Login</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
